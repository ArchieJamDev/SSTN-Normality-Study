# Esqueleto del workflow de simulacion (ver notes/DESIGN.md secciones 4, 7, 10 y 11).
# El job calibrate-null se elimino — resulto innecesario (ver DESIGN.md
# seccion 10): sstn::sstn() calibra internamente en cada llamada, rapido.
#
# IMPORTANTE: workflow_dispatch antes corria TODOS los jobs en cada disparo,
# incluyendo los ya cerrados/validados (pilotos, extraccion de datos reales,
# Bloque 1 completo con R=10000) -- desperdiciaba tiempo y minutos de Actions
# cada vez que se agregaba un job nuevo para otro bloque. Ahora cada grupo de
# jobs se activa con un input booleano independiente, todos en false por
# defecto salvo el bloque que este activo en desarrollo -- ver la lista de
# inputs abajo. Para re-correr algo ya cerrado (ej. reproducir el Bloque 1),
# pasar el input correspondiente en true explicitamente:
#   gh workflow run simulate.yml -f correr_bloque1=true

name: Simulacion SSTN

# Titulo de la corrida en la lista de Actions: por defecto GitHub repite el
# nombre del workflow en cada dispatch, indistinguible una corrida de otra.
# Arma un titulo legible concatenando que bloque(s) se activaron con -f
# (normalmente uno solo, pero puede ser mas de uno en el mismo dispatch).
run-name: >-
  Simulacion SSTN:
  ${{ inputs.correr_calibracion_bloque5_extendido && 'Calibracion Bloque 5 ext. (12 escenarios) ' || '' }}${{ inputs.correr_bloque5 && 'Bloque 5 -- categorias (72 shards) ' || '' }}${{ inputs.correr_bloque1 && 'Bloque 1 -- clasico (8 familias) ' || '' }}${{ inputs.correr_bloque2 && 'Bloque 2 -- platicurtica Beta ' || '' }}${{ inputs.correr_bloque2_explorar_n_alto && 'Bloque 2 -- explorar n alto ' || '' }}${{ inputs.correr_bloque3 && 'Bloque 3 -- plasmode (11 subescalas) ' || '' }}${{ inputs.correr_bloque4 && 'Bloque 4 -- remuestreo real (11 subescalas) ' || '' }}${{ inputs.correr_agregacion && 'Agregacion de resultados ' || '' }}${{ inputs.correr_pilotos_y_reales && 'Pilotos + datos reales ' || '' }}

on:
  workflow_dispatch:
    inputs:
      correr_pilotos_y_reales:
        description: "Pilotos + pipeline de datos reales (pilot-timing, battery-sanity-check, extract-subscales, feasibility-pilot, moments-and-feasibility, plasmode-sanity-check) -- ya validado, normalmente no hace falta"
        type: boolean
        default: false
      correr_bloque1:
        description: "Bloque 1 completo (classical-timing-pilot + simulate-classical, R=10000) -- ya cerrado, ver DESIGN.md seccion 22"
        type: boolean
        default: false
      correr_bloque2:
        description: "Bloque 2 (platykurtic-timing-pilot y/o simulate-platykurtic) -- cerrado, ver DESIGN.md secciones 26/27"
        type: boolean
        default: false

      correr_bloque2_explorar_n_alto:
        description: "Bloque 2 -- exploracion de n alto (n=1000,1500) via platykurtic-explore-n-alto, sin repetir el grid canonico de simulate-platykurtic"
        type: boolean
        default: false

      correr_bloque3:
        description: "Bloque 3 (simulate-plasmode, matrix de 11 subescalas, R=10000) -- cerrado, ver DESIGN.md seccion 28"
        type: boolean
        default: false

      correr_bloque4:
        description: "Bloque 4 (simulate-real-subsampling, matrix de 11 subescalas, R=10000) -- cerrado, ver DESIGN.md seccion 30"
        type: boolean
        default: false

      correr_agregacion:
        description: "Agregar los CSV finales de data/results/ en un consolidado (R/99_aggregate_results.R) -- correr de nuevo despues de cerrar el Bloque 5 para incluirlo"
        type: boolean
        default: false

      correr_bloque5:
        description: "Bloque 5 (simulate-categorias, matrix escenario x k = 72 shards desde la ampliacion sep 2026, antes 12) -- efecto de la cantidad de categorias de respuesta, ver DESIGN.md seccion 32"
        type: boolean
        default: false

      correr_calibracion_bloque5_extendido:
        description: "Calibra los umbrales que le faltan a la ampliacion del Bloque 5 (k=7,8 para los 3 escenarios ya publicados, y k=3..8 completo para las 9 subescalas reales nuevas) -- ver R/09b_calibrar_extension_bloque5.R. Correr ESTO antes de activar correr_bloque5 con la matrix ampliada, y consolidar+commitear su salida en data/results/calibracion_categorias_extendida.csv"
        type: boolean
        default: true

jobs:
  # Piloto de tiempos (ya corrido con exito, ver notes/pilot_sstn_timing.txt
  # commiteado en el repo) — se deja para poder re-correrlo si cambia algo
  # (version de paquetes, runner, etc.)
  pilot-timing:
    if: ${{ inputs.correr_pilotos_y_reales }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Correr piloto de tiempos SSTN
        run: Rscript R/00b_pilot_sstn_timing.R
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-sstn-timing
          path: notes/pilot_sstn_timing.txt

  # Sanity check de la bateria completa (11 pruebas, incluye Epps-Pulley
  # desde sep 2026) sobre datos de juguete, antes de correr la simulacion en
  # serio — confirma que las 10 pruebas clasicas + SSTN funcionan todas
  # juntas sin errores de dependencias.
  battery-sanity-check:
    if: ${{ inputs.correr_pilotos_y_reales }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Correr sanity check de la bateria de 11 pruebas
        run: Rscript R/08_run_battery.R

  # Extrae los puntajes de subescala reales (DASS, RIASEC, MACH-IV, RSE) desde
  # los .zip crudos en data/raw/ y sube los CSV resultantes como artifact —
  # son la entrada de 04_moments_and_feasibility.R y de 07_real_data_subsampling.R.
  extract-subscales:
    if: ${{ inputs.correr_pilotos_y_reales }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Extraer subescalas reales (DASS, RIASEC, MACH-IV, RSE)
        run: Rscript R/03_extract_real_subscales.R
      - uses: actions/upload-artifact@v4
        with:
          name: real-subscales-processed
          path: data/processed/*.csv

  # Piloto para validar contra los paquetes reales (SimMultiCorrData, gld) la
  # factibilidad Fleishman/GLD sobre los 11 puntos objetivo (asimetria,
  # curtosis) de las subescalas reales — antes de comprometer la version
  # final de 04_moments_and_feasibility.R. Depende de extract-subscales
  # (descarga su artifact a data/processed/).
  feasibility-pilot:
    if: ${{ inputs.correr_pilotos_y_reales }}
    needs: extract-subscales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - uses: actions/download-artifact@v4
        with:
          name: real-subscales-processed
          path: data/processed
      - name: Piloto de factibilidad Fleishman/GLD
        run: Rscript R/04b_pilot_feasibility.R
      - uses: actions/upload-artifact@v4
        with:
          name: feasibility-pilot-log
          path: notes/feasibility_pilot.txt

  # Version final: calcula asimetria/curtosis oficiales (N completo) de las 11
  # subescalas reales, confirma factibilidad Fleishman/Polynomial (FALSE para
  # las 11, ver DESIGN.md secciones 14 y 16) y ajusta GLD (gld::fit.fkml,
  # method="Mom" -- igualacion de momentos, ver seccion 16) sobre el N
  # COMPLETO de cada subescala — produce data/processed/plasmode_calibration.csv,
  # insumo directo de R/05_calibration_plasmode.R. Depende de extract-subscales.
  moments-and-feasibility:
    if: ${{ inputs.correr_pilotos_y_reales }}
    needs: extract-subscales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - uses: actions/download-artifact@v4
        with:
          name: real-subscales-processed
          path: data/processed
      - name: Calcular momentos oficiales y ajustar GLD (N completo)
        run: Rscript R/04_moments_and_feasibility.R
      - uses: actions/upload-artifact@v4
        with:
          name: plasmode-calibration
          path: |
            data/processed/plasmode_calibration.csv
            notes/moments_and_feasibility.txt

  # Sanity check del generador plasmode (Bloque 3): genera 1 replica de
  # n=5000 por subescala vía gld::rgl() con los parametros de
  # plasmode_calibration.csv y compara asimetria/curtosis empirica contra el
  # objetivo real, antes de usar el generador en la simulacion completa.
  # Depende de moments-and-feasibility (descarga su artifact
  # plasmode-calibration).
  plasmode-sanity-check:
    if: ${{ inputs.correr_pilotos_y_reales }}
    needs: moments-and-feasibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - uses: actions/download-artifact@v4
        with:
          # OJO: el artifact plasmode-calibration se subio con DOS paths sin
          # ancestro comun (data/processed/plasmode_calibration.csv Y
          # notes/moments_and_feasibility.txt), asi que preserva ambos
          # prefijos completos desde la raiz del repo (confirmado: el
          # usuario lo bajo con `gh run download` sin --path y el archivo
          # aparecio en <destino>/notes/moments_and_feasibility.txt, con el
          # prefijo "notes/" intacto). Por eso se descarga a la raiz del
          # workspace (".") en vez de a "data/processed" -- si se apuntara
          # ahi quedaria anidado en data/processed/data/processed/*.csv.
          name: plasmode-calibration
          path: .
      - name: Sanity check del generador plasmode (gld::rgl)
        run: Rscript R/05b_pilot_plasmode_sanity.R
      - uses: actions/upload-artifact@v4
        with:
          name: plasmode-sanity-check-log
          path: notes/plasmode_sanity_check.txt

  # Bloque 3 completo (simulacion plasmode), R=10000: version final, un shard por
  # subescala real (matrix de 11), depende de moments-and-feasibility (descarga su
  # artifact plasmode-calibration con los parametros GLD). Grid de n completo
  # {10,25,50,100,250,500,1000,1500} desde el arranque -- R/06_simulation_plasmode.R
  # soporta n_list desde su primera version, no como parche posterior (ver
  # notes/DESIGN.md seccion 28 y el incidente del Bloque 2, seccion 27).
  simulate-plasmode:
    if: ${{ inputs.correr_bloque3 }}
    # No depende de moments-and-feasibility (gateado por correr_pilotos_y_reales,
    # que por defecto es false) -- en vez de forzar esa corrida cara (~23 min) cada
    # vez que se dispara el Bloque 3, se descarga el artifact plasmode-calibration
    # directo de la corrida ya validada (35375789088, ver DESIGN.md secciones 14 y
    # 28). Si ese artifact expira, correr una vez con correr_pilotos_y_reales=true
    # y actualizar el run-id de abajo con el ID de la corrida nueva.
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        subescala:
          - dass_anxiety
          - dass_depression
          - dass_stress
          - mach_total
          - riasec_artistic
          - riasec_conventional
          - riasec_enterprising
          - riasec_investigative
          - riasec_realistic
          - riasec_social
          - rse_total
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - uses: actions/download-artifact@v4
        with:
          # mismo motivo que en plasmode-sanity-check: el artifact trae
          # data/processed/ y notes/ sin ancestro comun, se descarga a la raiz.
          # run-id fijo: ver comentario arriba del job.
          name: plasmode-calibration
          path: .
          run-id: 35375789088
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bloque 3 completo (R=10000)
        run: Rscript R/06_simulation_plasmode.R ${{ matrix.subescala }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: plasmode-final-${{ matrix.subescala }}
          path: data/results/bloque3_${{ matrix.subescala }}.csv

  # Bloque 4 completo (remuestreo m-out-of-N sobre datos reales), R=10000: un
  # shard por subescala real (matrix de 11), grid de n especifico por
  # instrumento (ver notes/DESIGN.md seccion 29). Mismo patron que
  # simulate-plasmode: no depende de extract-subscales en la misma corrida
  # (gateado por correr_pilotos_y_reales, default false) -- descarga el
  # artifact real-subscales-processed directo de la corrida ya validada
  # (35375789088) por run-id fijo.
  simulate-real-subsampling:
    if: ${{ inputs.correr_bloque4 }}
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        subescala:
          - dass_anxiety
          - dass_depression
          - dass_stress
          - mach_total
          - riasec_artistic
          - riasec_conventional
          - riasec_enterprising
          - riasec_investigative
          - riasec_realistic
          - riasec_social
          - rse_total
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - uses: actions/download-artifact@v4
        with:
          name: real-subscales-processed
          path: data/processed
          run-id: 35375789088
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bloque 4 completo (R=10000)
        run: Rscript R/07_real_data_subsampling.R ${{ matrix.subescala }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: real-subsampling-final-${{ matrix.subescala }}
          path: data/results/bloque4_${{ matrix.subescala }}.csv

  # Agrega los cuatro CSV finales de los Bloques 1-4 en un solo dataset
  # consolidado (ver notes/DESIGN.md seccion 31 y R/99_aggregate_results.R).
  # No depende de ningun otro job de esta corrida: los CSV de entrada ya
  # estan commiteados en data/results/ (actions/checkout los trae), no hace
  # falta descargar artifacts. Tampoco hace falta matrix ni los paquetes de
  # pruebas estadisticas (sstn, nortest, etc.) -- el script solo usa readr.
  aggregate-results:
    if: ${{ inputs.correr_agregacion }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
      - name: Agregar los bloques disponibles
        run: Rscript R/99_aggregate_results.R
      - uses: actions/upload-artifact@v4
        with:
          name: consolidado
          path: data/results/consolidado.csv

  # Calibracion de la ampliacion del Bloque 5 (sep 2026, ver
  # R/09b_calibrar_extension_bloque5.R): k=7,8 para los 3 escenarios ya
  # publicados (A_simetrica, B1_riasec_realistic, B2_dass_depression) y
  # k=3..8 completo para las 9 subescalas reales restantes de las 11 ya
  # usadas en los Bloques 3-4 (C1..C9). No corre run_battery() ni depende de
  # los paquetes de pruebas estadisticas -- solo optim() base y el CSV de
  # momentos objetivo ya commiteado (data/processed/plasmode_calibration.csv,
  # producido por moments-and-feasibility), por eso su lista de paquetes es
  # mucho mas liviana que el resto de los jobs. Un shard por escenario (12),
  # cada uno calibra internamente todos los k que le falten en un loop --
  # cada celda tarda segundos, no minutos, asi que no hace falta un segundo
  # eje en la matrix.
  #
  # PASO SIGUIENTE MANUAL tras esta corrida (no automatizado en este
  # workflow, mismo criterio que el resto del proyecto -- ver comentario del
  # job aggregate-results): descargar los 12 artifacts
  # calibracion-categorias-<escenario>, concatenar sus CSV en uno solo
  # (R/09c_consolidar_calibracion_extendida.R) y commitear el resultado como
  # data/results/calibracion_categorias_extendida.csv -- R/09_calibration_categorias.R
  # lo lee automaticamente al cargarse. Recien despues de eso
  # simulate-categorias (abajo) puede correr las celdas nuevas.
  calibrate-categorias-extendido:
    if: ${{ inputs.correr_calibracion_bloque5_extendido }}
    strategy:
      matrix:
        escenario:
          - A_simetrica
          - B1_riasec_realistic
          - B2_dass_depression
          - C1_dass_anxiety
          - C2_dass_stress
          - C3_mach_total
          - C4_riasec_artistic
          - C5_riasec_conventional
          - C6_riasec_enterprising
          - C7_riasec_investigative
          - C8_riasec_social
          - C9_rse_total
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
      - uses: actions/download-artifact@v4
        with:
          # mismo motivo que en simulate-plasmode: el artifact trae
          # data/processed/ y notes/ sin ancestro comun, se descarga a la
          # raiz. run-id fijo (35375789088, ver comentario de
          # simulate-plasmode) -- R/09b_calibrar_extension_bloque5.R lee
          # data/processed/plasmode_calibration.csv para todo escenario
          # que no sea A_simetrica.
          name: plasmode-calibration
          path: .
          run-id: 35375789088
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Calibrar celdas nuevas del Bloque 5 (Nelder-Mead)
        run: Rscript R/09b_calibrar_extension_bloque5.R ${{ matrix.escenario }}
      - uses: actions/upload-artifact@v4
        with:
          name: calibracion-categorias-${{ matrix.escenario }}
          path: data/results/calibracion_categorias_${{ matrix.escenario }}.csv

  # Bloque 5 -- efecto de la cantidad de categorias de respuesta (k) sobre
  # la potencia de las pruebas de normalidad (ver notes/DESIGN.md seccion
  # 32). Dos ejes cruzados (escenario x k = 72 celdas desde la ampliacion de
  # sep 2026, antes 12), a diferencia de los bloques anteriores (un solo
  # eje) -- la matrix usa dos claves separadas, GitHub Actions arma el
  # producto cruzado automaticamente (72 shards), sin necesidad de una lista
  # de pares escrita a mano. Requiere que data/results/calibracion_categorias_extendida.csv
  # ya este commiteado en el repo (ver job calibrate-categorias-extendido de
  # arriba) para las 9 celdas C1..C9 y para k=7,8 de A/B1/B2 -- los umbrales
  # de k=3..6 de A/B1/B2 siguen hardcodeados en R/09_calibration_categorias.R
  # como siempre. No depende de ningun otro job del workflow en tiempo de
  # ejecucion (actions/checkout trae ambas fuentes ya commiteadas), no hace
  # falta descargar ningun artifact.
  simulate-categorias:
    if: ${{ inputs.correr_bloque5 }}
    strategy:
      matrix:
        escenario:
          - A_simetrica
          - B1_riasec_realistic
          - B2_dass_depression
          - C1_dass_anxiety
          - C2_dass_stress
          - C3_mach_total
          - C4_riasec_artistic
          - C5_riasec_conventional
          - C6_riasec_enterprising
          - C7_riasec_investigative
          - C8_riasec_social
          - C9_rse_total
        k: [3, 4, 5, 6, 7, 8]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Bloque 5 completo (R=10000)
        run: Rscript R/10_simulation_categorias.R ${{ matrix.escenario }} ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        with:
          name: categorias-final-${{ matrix.escenario }}-k${{ matrix.k }}
          path: data/results/bloque5_${{ matrix.escenario }}_k${{ matrix.k }}.csv

  # Piloto de tiempos del Bloque 1 (replica directa): corre la bateria
  # completa de 11 pruebas (no solo SSTN, que ya se midio en pilot-timing)
  # con R chico (200 replicas) sobre las 8 familias del paper original, para
  # medir el costo real antes de comprometer R=10000 en el matrix completo.
  # No depende de otros jobs (genera datos sinteticos, no usa datos reales).
  # Se deja como referencia/regresion — mismo patron que pilot-timing.
  classical-timing-pilot:
    if: ${{ inputs.correr_bloque1 }}
    strategy:
      matrix:
        familia:
          - normal_desplazada
          - gamma
          - chi2
          - lognormal
          - weibull
          - t_student
          - mezcla_normal
          - convolucion_uniforme_normal
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Piloto de tiempos Bloque 1 (R=200)
        run: Rscript R/01_simulation_classical.R ${{ matrix.familia }} 200
      - uses: actions/upload-artifact@v4
        with:
          name: classical-pilot-${{ matrix.familia }}
          path: data/results/bloque1_${{ matrix.familia }}.csv

  # Bloque 1 completo (replica directa), R=10000: version final, un shard por
  # familia (matrix de 8), sin dependencias de otros jobs. Tiempos reales
  # medidos con datos limpios (corrida 35430523246, ver DESIGN.md seccion 21):
  # entre 18.8 min (mezcla_normal) y 32.5 min (gamma) de computo puro por
  # familia a R=10000 -- muy por debajo del limite de 6h por job, no hace
  # falta partir ademas por n. CERRADO (corrida 35431776551, ver seccion 22)
  # -- solo se re-corre si correr_bloque1=true explicitamente.
  simulate-classical:
    if: ${{ inputs.correr_bloque1 }}
    strategy:
      matrix:
        familia:
          - normal_desplazada
          - gamma
          - chi2
          - lognormal
          - weibull
          - t_student
          - mezcla_normal
          - convolucion_uniforme_normal
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Bloque 1 completo (R=10000)
        run: Rscript R/01_simulation_classical.R ${{ matrix.familia }} 10000
      - uses: actions/upload-artifact@v4
        with:
          name: classical-final-${{ matrix.familia }}
          path: data/results/bloque1_${{ matrix.familia }}.csv

  # Bloque 2 (extension platicurtica, familia Beta(a,a) -- ver DESIGN.md
  # secciones 3 y 23), directo a R=10000, sin piloto previo: con el Bloque 1
  # completo (seccion 21) ya hay evidencia real de que ninguna familia se
  # acerca al limite de 6h (18-40 min a R=10000), asi que medir tiempos de
  # nuevo no aporta nada -- ver seccion 25. El patron de NA se valida despues
  # de la corrida sobre el CSV resultante, igual que se hizo para el Bloque 1.
  simulate-platykurtic:
    if: ${{ inputs.correr_bloque2 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Bloque 2 completo (R=10000)
        run: Rscript R/02_simulation_platykurtic.R beta 10000
      - uses: actions/upload-artifact@v4
        with:
          name: platykurtic-final-beta
          path: data/results/bloque2_beta.csv

  # Corrida exploratoria puntual para decidir el techo de n del Bloque 2 (ver
  # DESIGN.md seccion 26 -- todavia en discusion si atar n_max a la escalera
  # de n real del Bloque 4). Corre SOLO n=1000 y n=1500 (12 celdas: 2 n x 6
  # valores de a, no las 36 del grid completo) para no repetir las celdas de
  # n<=500 ya cubiertas por simulate-platykurtic. Sale a un archivo con sufijo
  # _n1000-1500 (no pisa bloque2_beta.csv) -- una vez cerrado el techo final,
  # estas celdas se concatenan directo con el resto, no hace falta
  # re-correrlas.
  platykurtic-explore-n-alto:
    if: ${{ inputs.correr_bloque2_explorar_n_alto }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::sstn
            any::nortest
            any::moments
            any::tseries
            any::fBasics
            any::nortsTest
            any::gld
            any::SimMultiCorrData
      - name: Exploratorio Bloque 2, n=1000 y n=1500 (R=10000)
        run: Rscript R/02_simulation_platykurtic.R beta 10000 1000,1500
      - uses: actions/upload-artifact@v4
        with:
          name: platykurtic-explore-n-alto
          path: data/results/bloque2_beta_n1000-1500.csv

  # TODO: job "simulate" para el Bloque 3 (calibracion plasmode, mismo patron).
  #
  # TODO: job final "aggregate" que descarga todos los artifacts del matrix y
  #       corre R/99_aggregate_results.R.
